<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabuterji - Remote Control</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>🕊️ Kabuterji</h1>
            <p>Testing Localhost from InfinityFree</p>
        </header>

        <main>
            <div class="card">
                <h3>Relay Server URL (Public IP)</h3>
                <input type="text" id="relayUrl" placeholder="http://123.45.67.89:8000" value="http://localhost:8000">
                <p class="hint">Yaha apne Relay Server (VPS) ka IP dalein. Testing ke liye localhost:8000 rehne dein.</p>
            </div>

            <div class="actions">
                <button id="getHelloBtn" class="primary-btn">Get Data (GET /hello)</button>
                <button id="postDataBtn" class="secondary-btn">Post Data (POST /data)</button>
            </div>

            <div class="response-section">
                <h3>Response:</h3>
                <div id="statusIndicator" class="status">Status: Waiting...</div>
                <pre id="responseOutput">{}</pre>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
