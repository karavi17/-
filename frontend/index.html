<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabuterji - MovieBox API Bridge</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>🕊️ Kabuterji</h1>
            <p>MovieBox API Bridge (InfinityFree ➡️ Localhost)</p>
        </header>

        <main>
            <div class="card info-box">
                <h3>Relay Status</h3>
                <p id="relayStatus">Railway URL: <span class="url">perfect-cooperation-production-824e.up.railway.app</span></p>
                <p class="hint">Ensure your Local Agent is running to receive requests.</p>
            </div>

            <div class="actions">
                <button id="getHelloBtn" class="primary-btn">Fetch Movie List</button>
                <button id="postDataBtn" class="secondary-btn">Test POST Request</button>
            </div>

            <div class="response-section">
                <div id="statusIndicator" class="status">Status: Ready</div>
                <h3>Backend Response:</h3>
                <pre id="responseOutput">{}</pre>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
